services:
  iot-project:
    tty: true
    pull_policy: always
    restart: unless-stopped
    image: ${REGISTRY_URL:-registry.stevenlie.my.id}/stevenlie14/iot-project:latest
    build:
      context: .
    container_name: iot-project
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7575:7575"
    environment:
      - PORT=7575
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USER:-iot_project}
      - PGPASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - PGDATABASE=${DB_NAME:-iot_project}
      - MQTT_URL=${MQTT_URL:-mqtt://broker.hivemq.com:1883}
      - TOPIC_BASE=${TOPIC_BASE:-iot-project/steven-2802941592}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    networks:
      - iot_project_net

  db:
    image: postgres:17-alpine
    container_name: iot-project-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-iot_project}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=${DB_NAME:-iot_project}
    # Open to the internet on port 5433 (5432 is taken by another Postgres on the server)
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - iot_project_pg:/var/lib/postgresql/data
    networks:
      - iot_project_net

  nodered:
    pull_policy: always
    restart: unless-stopped
    image: ${REGISTRY_URL:-registry.stevenlie.my.id}/stevenlie14/iot-project-nodered:latest
    build:
      context: ./nodered
    container_name: iot-project-nodered
    ports:
      - "7576:1880"
    environment:
      - PORT=1880
      - MQTT_URL=${MQTT_URL:-mqtt://broker.hivemq.com:1883}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
    networks:
      - iot_project_net

volumes:
  iot_project_pg:

networks:
  iot_project_net:
    driver: bridge
